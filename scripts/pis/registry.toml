# Committable Pi registry (no secrets).
#
# Secrets are loaded from environment variables (optionally via a local env file),
# so this file can live in source control.
#
# See: ./scripts/pis/pis-secrets.env.example
[defaults]
user = "pi"
controller_url = "http://10.10.13.9:24422/"
guide_port = 5173
server_port = 8787

[defaults.nas]
host = "nas.mars.college"
share = "share"
mount = "/Volumes/share"

# ---- Upper East ----
[pis.upper-east-1]
host = "mars32.local"
ip = "100.128.0.120"
node_name = "upper-east-1"

[pis.upper-east-2]
host = "mars31.local"
ip = "100.128.0.119"
node_name = "upper-east-2"

[pis.upper-east-3]
host = "mars29.local"
ip = "100.128.0.118"
node_name = "upper-east-3"

[pis.upper-east-4]
host = "mars07.local"
ip = "100.128.0.112"
node_name = "upper-east-4"

# ---- Upper West ----
[pis.upper-west-1]
host = "mars15.local"
ip = "100.128.0.114"
node_name = "upper-west-1"

[pis.upper-west-2]
host = "mars19.local"
ip = "100.128.0.115"
node_name = "upper-west-2"

[pis.upper-west-3]
