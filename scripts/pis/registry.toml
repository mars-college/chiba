[pis.upper-west-4]
host = "mars03.local"
ip = "100.128.0.111"
node_name = "upper-west-4"

[pis.upper-west-4.cable]
mode = "gallery"
theme = "gallery"
channel = "earl"
playlist = true
nosplash = true
lock = true
qr = false

# ---- Lower East ----
