# Midterms gallery profile.
#
# This file is meant to be composable with the base inventory registry:
#   - inventory (public state): scripts/pis/registry.toml
#   - profile (show state): this file
#
# Apply it with:
#   ./scripts/pis/apply-cable-launch.sh \
#     --inventory ./scripts/pis/registry.toml \
#     --mode ./cable2/config/profiles/midterms-gallery.toml \
#     --pi upper-west-4
#
# Notes:
# - Screen orientation should primarily live in `registry.toml`.
# - Optional per-profile override is available via `display_rotate = 0|90|180|270`.
[defaults.cable]
mode = "gallery"
theme = "gallery"
nosplash = true
lock = true
qr = false
hud = "always"
prefetch_stash = true
prefetch_cache = true

# Midterms content assignments:
# - LW1 -> ria
# - LW2 -> jordan
# - LW3 -> alicia
# - LW4 -> freeman
# - LE1 -> (unassigned)
# - LE2-2 -> lyosha
# - LE3-2 -> anna
# - LE2 -> yulia
# - LE3 -> chebel
# - LE4 -> co-lab
# - UW1 -> marzipan
# - UW2 -> marzipan
# - UW3 -> vanessa
# - UW4 -> earl
# - UE1 -> seva
# - UE2 -> kamau
# - UE3 -> zayne
# - UE4 -> tarcila
[pis.lower-west-1.cable]
target_kind = "channel"
target_id = "midterms-ria"
channel = "midterms-ria"
prefetch_targets = ["channel:midterms-ria"]

