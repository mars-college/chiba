title = "Reference image 1: Exterior termite mound land art sculpture in desert. Task: Create an interior perspective view looking through the pallet-rack warehouse skeleton supporting the mud sculpture. Show: - Parallel rows of vertical pallet-rack uprights marching through the interior space - Uprights evenly spaced (2x spacing between uprights as their width) - Cross-beams connecting the uprights at multiple heights - Shelving or horizontal supports on the racks - The mudded ceiling and walls visible above and around the framework - Light filtering through cavern openings and between uprights - Natural shadows cast by the framework - The interior reads as both warehouse grid and organic sculptural support - Human figures for scale Photorealistic interior architectural photography showing how the rational pallet-rack system becomes a dramatic structural cathedral when enclosed by the organic mud envelope."
tag = "FREEMAN"

[[item]]
media = "m-eden-697d4caa3a837420a29935a2"
duration_slots = 1
title = "Land art installation 10: \"UNDERGROUND CISTERN TEMPLE\" - A desert landscape sculpture inspired by both termite mound water management and Sietch water conservation. The 24-foot structure appears mostly underground, with only the organic ribbed dome roof visible above the sand, resembling a massive termite mound. The entire north and west sides are buried and windproofed. A dramatic central vaulted chamber descends 20+ feet into the earth, accessed via a spiral ramp or carved passages. The interior vault is cathedral-like with mudded walls and a natural-looking spring or water feature at the lowest point (symbolic or actual water cistern). Strategic apertures in the dome allow filtered light to illuminate the sacred chamber space. The mud surfaces have organic ribbed patterns throughout, mimicking both termite and natural geological formations. Photorealistic rendering showing exterior as a subtle mound with minimal visible openings, and interior showing the dramatic descent into the vaulted temple chamber with warm light filtering through openings, reflecting off water surfaces below."
tag = "FREEMAN"

[[item]]
media = "m-eden-697d4c733a837420a29935a0"
duration_slots = 1
title = "Land art installation 6: \"TERMITE CATHEDRAL\" - A massive desert landscape sculpture inspired by termite mound architecture. Rising 24 feet with a 5000 sq ft footprint. The mudded exterior mimics the organic ribbed and vaulted surface of a real termite mound—vertical ridges, flowing curves, and natural-looking weathering patterns. The structure is oriented vertically like a termite mound, with the highest point on the north side acting as a wind deflector. The south and east faces are riddled with cavern-like openings and organic tunnel entrances, creating deep shade galleries and wind-sheltered passages. The interior is a maze of chambers and vaulted passages supporting the mud shell. From ground level, the towering mudded ridges feel like entering a massive insect cathedral. Photorealistic rendering showing the organic ribbed mud surface, dramatic shadows in the cavern openings, desert plants at base. Golden hour lighting."
tag = "FREEMAN"

[[item]]
media = "m-eden-697d4b743a837420a299359f"
duration_slots = 1
title = "Land art installation 4: \"DEFLECTION WINGS\" - Twin or triple massive curved mud-covered structures rising 24 feet, each with a 5000 sq ft footprint (or shared across the installation). The forms resemble natural rock formations or wind-sculpted geological features. The curves are oriented to deflect north and west winds upward and around, creating calm sheltered zones on the south and east sides. The mudded surfaces are thick and textured. Openings and alcoves throughout provide shade and gathering spaces. The installation reads as natural landscape from a distance—a series of mysterious outcroppings. From ground level, the curves and surfaces create dramatic architecture. Photorealistic rendering showing the sculptural forms, shadows cast by the curves, the feeling of wind deflection and protection. Desert plants at base. Golden light illuminating the mud surfaces."
tag = "FREEMAN"

[[item]]
media = "m-eden-697d4b71cb1b145e9e3a75c2"
duration_slots = 1
title = "Land art installation 3: \"THERMAL DOME\" - A massive dome-like landscape sculpture rising 24 feet from the desert floor. 5000 sq ft footprint. The exterior is a seamless mudded surface mimicking a natural stone dome or geological formation. The dome has a dark south-facing side (thermal mass) and a lighter reflective north-facing side. The base of the dome opens to the south and east, creating a deep shaded alcove underneath that provides wind shelter from north and west. The interior framework is minimally visible. The mudded surface has organic texture and weathering patterns. Photorealistic rendering from ground level showing the monumental curved form towering overhead, the sense of shelter and coolness in the shade. Desert vegetation around the base. Dramatic shadow play on the mudded surface."
tag = "FREEMAN"

[[item]]
media = "m-eden-697d4b6f3a837420a299359e"
duration_slots = 1
title = "Land art installation 2: \"WIND LABYRINTH\" - Desert landscape sculpture, 24 feet high, 5000 sq ft footprint. The structure forms a spiral or labyrinthine maze pattern when viewed from above, but from ground level appears as a series of sculpted mud walls and passages creating a natural-looking canyon or valley system. Walls are curved and organic, finished in thick mud coating. The labyrinth is oriented to funnel north and west winds through the structure, creating cooling and sound effects as wind passes through. Interior spaces provide deep shade and wind shelter. Openings on the south and east sides allow warm light in. Photorealistic ground-level perspective showing the towering mud walls, the feeling of being in a carved geological feature. Desert shadows. The installation feels like walking through an ancient eroded canyon."
tag = "FREEMAN"

