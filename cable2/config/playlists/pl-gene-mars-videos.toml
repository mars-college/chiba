title = "References: - Image 1: starting frame; group photo on wooden stairs; preserve composition and environment. Explosive mechanical transformation sequence inspired by Michael Bay Transformers style: Each person simultaneously explodes into a dynamic transformation—bodies fragment into hundreds of spinning mechanical parts, gears, panels, and metal components that swirl and reassemble mid-air. Dramatic lens flares burst across frame. Metal plates flip and lock into place with precision. Glowing blue energy pulses through seams. Parts rotate in impossible geometric patterns as they reconfigure from human form into mechanical duck shape. Each duck emerges with metallic beaks, glowing eyes, articulated wings with visible pistons, brass chest plates with exposed clockwork. Sparks fly. Chrome surfaces catch sunset light. Final poses match original positions but with mechanical duck swagger. Camera: dynamic push-in with slight handheld shake, golden hour lighting with intense backlighting and lens flares."
