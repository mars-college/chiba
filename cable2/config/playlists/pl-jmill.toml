title = "References 1-4: card layout templates showing yellow rounded frame, title banner, text box structure; copy exact frame design. Reference 5: timeline convergence artwork; integrate as primary visual. Create complete Hypotheticards card for 'Timeline Dividend'. Yellow rounded border, title banner at top reading 'Timeline Dividend', artwork from Reference 5 in center, cream text box at bottom with card rules: 'If you have successfully maintained actions in two or more timelines for at least three turns, you may play this card. Collect one resource, insight, or advantage from each timeline you've been operating in. These rewards stack. For each timeline where other players confirm you served that reality authentically, draw two additional cards. This is the payoff for coherence across realities. Emergence rewards those who can hold multiple truths simultaneously.'"
