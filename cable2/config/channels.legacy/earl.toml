call_sign = "EARL"
accent = "#d2ff73"
description = "Midterms gallery: Earl (NAS-backed with local stash caching)."

[info]
artist = "Earl Scioneaux, III"
title = "Unhung Zeros' \"Star\" video tests"
description = "Various tool test results for music video."
mode = "always"
show_sec = 8

# NOTE:
# - These programs reference the NAS mount path.
# - `cache = true` causes the server to serve via `/stash/...` which is a local
#   cache on each Pi. If not cached yet, `/stash` returns a fast 404 so playlist
#   mode can skip until media is warmed.

