title = "Surrealist dinner party in the style of Salvador Dalí featuring purple donuts as guests seated at a long table in a vast desert landscape. The donuts are melting, warping, and distorting with impossible geometries—some floating above chairs, some with elongated torus forms, some vibrating with plasma auras. The table stretches toward a vanishing point under a hypnotic desert sky. Soft, drooping donuts with glazing that flows like liquid, toroidal structures bending spacetime. Dreamlike atmosphere with impossible shadows, impossible perspective, surreal light. Burning desert horizon, strange mountains, a watch or clock melting nearby. Ethereal, otherworldly, deeply unreal yet visually coherent. High detail, classical surrealism."
