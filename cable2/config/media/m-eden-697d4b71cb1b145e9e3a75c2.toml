title = "Land art installation 3: \"THERMAL DOME\" - A massive dome-like landscape sculpture rising 24 feet from the desert floor. 5000 sq ft footprint. The exterior is a seamless mudded surface mimicking a natural stone dome or geological formation. The dome has a dark south-facing side (thermal mass) and a lighter reflective north-facing side. The base of the dome opens to the south and east, creating a deep shaded alcove underneath that provides wind shelter from north and west. The interior framework is minimally visible. The mudded surface has organic texture and weathering patterns. Photorealistic rendering from ground level showing the monumental curved form towering overhead, the sense of shelter and coolness in the shade. Desert vegetation around the base. Dramatic shadow play on the mudded surface."
