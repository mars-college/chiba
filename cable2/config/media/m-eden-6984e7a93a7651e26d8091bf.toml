title = "Image 1: ITER tokamak cross-section. Show the massive toroidal magnetic confinement vessel with central solenoid at the core, toroidal field coils arranged radially around the torus, and poloidal field coils shaping the plasma. Display the internal vacuum chamber containing the donut-shaped plasma glowing purple. Include supporting cryogenic systems, neutral beam injectors, and the scale of the chamber (840 cubic meters). Highly engineered, massive steel and superconducting structure. Reference actual ITER architecture with precision engineering visible."
