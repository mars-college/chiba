title = "Square 1:1 image. Black background. Radially symmetrical biocybernetic remix of Mars College logo silhouette. Hallucinatory, handsome, lysergic terraforming transcendent aesthetic. Logo's decorative vocabulary and silhouette maintained but reimagined through superorganismal subcellular imagery: tender mucilage billowing from mitochondrial cristae involutions and reticula, effulgent chiaroscuro highlighting tryptamine color contrast. Futuristic tissue culture aesthetic: laminar polyp colonies, neuronal slime-mold moss, gnetophyte folia, vaulted termite-mound sporangia glooping with pseudopods. Refined, stately color palette with bright accent pops for dream-state emphasis. Clean linework, art-nouveau flourishes, sophisticated ornamental detail. Silhouette and contour luminous against deep black."
