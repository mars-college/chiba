title = "References: - Image 1: Mars College logo (colorful version); copy silhouette and decorative vocabulary. Task: Generate a square 1:1 image remixing the Mars College logo silhouette on black background as a graphic illustration style. Radially symmetrical, biocybernetic, sumptuous yet lysergic and surreal, otherworldly. This is an engineered colonial superorganism designed to warn of excessive botswarms passing through vicinity. Concept: Chitinous exoskeletal warning beacon with geometric rifts and crystalline fracture-planes that illuminate when detecting robotic proximity. Render as high-contrast graphic illustration with sharp geometric shapes and ornamental spiky protrusions. Use deep teal dominant with molten gold accents. Teal for the armored exoskeleton and chitinous segments; gold for the fracture-planes and internal bioluminescent warning systems glowing through cracks. Angular, hostile, beautiful. Convey vigilant otherworldly sentience. Effulgent chiaroscuro highlighting geometric armature."
