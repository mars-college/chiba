title = "Land art installation 6: \"TERMITE CATHEDRAL\" - A massive desert landscape sculpture inspired by termite mound architecture. Rising 24 feet with a 5000 sq ft footprint. The mudded exterior mimics the organic ribbed and vaulted surface of a real termite mound—vertical ridges, flowing curves, and natural-looking weathering patterns. The structure is oriented vertically like a termite mound, with the highest point on the north side acting as a wind deflector. The south and east faces are riddled with cavern-like openings and organic tunnel entrances, creating deep shade galleries and wind-sheltered passages. The interior is a maze of chambers and vaulted passages supporting the mud shell. From ground level, the towering mudded ridges feel like entering a massive insect cathedral. Photorealistic rendering showing the organic ribbed mud surface, dramatic shadows in the cavern openings, desert plants at base. Golden hour lighting."
