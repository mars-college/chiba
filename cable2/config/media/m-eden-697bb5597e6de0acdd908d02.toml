title = "Architectural top-down roof plan view of a solar-powered donut structure. Perfect torus footprint with toroidal geometry rendered as blueprint/technical drawing. Solar panels arranged in concentric rings following the torus surface curvature—panels oriented optimally for sun exposure. Central void (the hole) depicted as open courtyard/atrium space. Metallic gold and deep purple color scheme mimicking the donut's glazing. Technical line work, gridlines, dimension markers, legend. Photorealistic materials: reflective solar panel surfaces catching light, structural ribs visible as geometric lines. Blueprint aesthetic mixed with aerial perspective. Precise mathematical proportions. Seen from directly above as if drone photography of the finished structure."
