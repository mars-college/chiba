title = "Plasma self-organization in a magnetized torus: Complex filament structures, vortices, and double layers forming intricate geometric patterns. The plasma is visibly structured, not uniform—thin bright threads weave through the magnetic field creating frameworks and nodes. Colors shift from purple to lavender to blue depending on field intensity. The geometry appears almost organic, like a living system organizing itself. Magnetic field lines are visible as precise curves constraining and shaping the plasma. Dark background. The image conveys: plasma as a thinking geometry, self-aware through its own physics."
