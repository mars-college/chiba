title = "Image 3: SPARC tokamak (Commonwealth Fusion Systems) compact high-field design. Show the smaller, more efficient tokamak with D-shaped toroidal field magnets, vacuum vessel, central solenoid, and cryogenic base. Display high-temperature superconducting (HTS) magnets—these are fundamentally different from older designs and enable much stronger fields in a compact form. Include the 75-ton cryostat base, supporting infrastructure, and purple glowing plasma confined magnetically. Reference the actual design currently under construction in Devens, Massachusetts."
