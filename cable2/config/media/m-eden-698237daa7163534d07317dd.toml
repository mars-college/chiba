title = "Top-down architectural view of a massive toroidal sound temple designed by Nikola Tesla. The donut structure is rendered in metallic silver and copper, with intricate geometric coil patterns spiraling around the torus surface. Concentric rings and frequency-resonant grooves radiate inward toward the central void—the event horizon—creating a visual representation of vibration and sound propagation. Thin filaments of glowing violet and cyan light spiral through the grooves, expressing high-frequency oscillations and standing waves. The entire torus radiates subtle concentric ripples emanating from the center, as if sound waves are propagating outward through the architecture itself. The background is pure black void. Overhead lighting emphasizes the metallic sheen and reveals the intricate engineering beneath. The composition is perfectly symmetrical, centered, and architectural in precision."
