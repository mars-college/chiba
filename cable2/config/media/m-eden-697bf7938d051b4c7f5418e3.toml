title = "A Mars College donut (torus) with dusty-gold pastry base. The glaze is cut through with visible salt-crystal shards catching light, creating sharp geometric facets. Surface dusted with desert ochre, rust-red mineral deposits, and fine sand particles. The toroidal geometry is enhanced by the crystalline texture—the hole at center appears deep, reminiscent of ancient lake beds. Warm, earthy palette: golds, rust reds, pale ochres, mineral whites. The glaze has a weathered, geological quality—as if it's been sculpted by wind and time. Lighting suggests late afternoon desert sun hitting the salt crystals, creating sparkle and shadow. The structure feels both sweet and austere. Hyperreal, close-up macro detail on the surface texture. Floating in soft desert-hued background (pale tan, dusty rose)."
