title = "Reference image: Plasma confined in toroidal magnetic field geometry, showing standing waves, oscillating filaments, and harmonic echoes radiating from center. Motion: Smooth camera zoom inward from the outer edge of the torus, moving into the interior tube. As we zoom deeper inside, the standing waves, filaments, and oscillations become more detailed and immersive. The plasma pulses and oscillates in harmonic rhythm—waves ripple outward and collapse inward. Filaments glow brighter and dimmer. Echoes fade and brighten as new oscillations propagate. The magnetic field structure becomes increasingly visible and intricate as we move closer. The overall motion is continuous, smooth, organic—the plasma breathing and resonating as we move through it. Full 10-second duration. No cuts. Dark background, luminous plasma. Immersive interior perspective."
