title = "Roof plan / architectural top-down view of a purple donut. Aerial view looking straight down from directly above. The torus is a perfect circle. The torus body is deep rich purple glaze with glossy, wet texture. Across the entire surface of the torus sits a complete ecosystem and miniature town: lavender fields bloom densely, little houses and buildings nestle between the flowers, streets and pathways wind through the landscape, parks and gardens dot the surface, tiny trees and vegetation fill the spaces. Rivers and water features flow throughout the landscape—meandering rivers, streams, ponds, and lakes embedded in the glaze between the houses and fields. The town has urban planning with water-integrated infrastructure. The outer edge has saturated, syrupy purple highlights. The center is open space, no event horizon or void. Pure black background. The entire donut ecosystem must be fully visible. Clean minimalist composition. Orthographic architectural perspective."
